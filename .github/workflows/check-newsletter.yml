name: Check Slava newsletter

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slavapost-import
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover and import new editions
        run: python scripts/linkedin_textpack.py --discover --config config.json
      - name: Upload new TextPacks
        uses: actions/upload-artifact@v4
        with:
          name: new-slavapost-textpacks
          path: posts/*/dist/*.textpack
          if-no-files-found: ignore
      - name: Commit new editions
        run: |
          git config user.name "slavapost[bot]"
          git config user.email "slavapost[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet && exit 0
          git commit -m "Import latest Slava Tykhonov newsletter edition"
          git pull --rebase
          git push
