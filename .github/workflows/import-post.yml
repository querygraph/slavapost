name: Import LinkedIn post

on:
  workflow_dispatch:
    inputs:
      post_url:
        description: Public LinkedIn newsletter post URL
        required: true
        type: string
      blog:
        description: Omnighost destination blog
        required: true
        default: querygraph.ai
        type: string
      tags:
        description: Semicolon-separated Ghost tags
        required: false
        default: Slava Tykhonov;Croissant, Graphs and AI;AI
        type: string

permissions:
  contents: write

concurrency:
  group: slavapost-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: convert
        env:
          POST_URL: ${{ inputs.post_url }}
          BLOG: ${{ inputs.blog }}
          TAGS: ${{ inputs.tags }}
        run: python scripts/linkedin_textpack.py "$POST_URL" --blog "$BLOG" --tags "$TAGS"
      - name: Verify TextPack
        env:
          TEXTPACK: ${{ steps.convert.outputs.textpack }}
        run: python -m zipfile -t "$TEXTPACK"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.convert.outputs.slug }}-textpack
          path: ${{ steps.convert.outputs.textpack }}
          if-no-files-found: error
      - name: Commit imported edition
        env:
          TITLE: ${{ steps.convert.outputs.title }}
        run: |
          git config user.name "slavapost[bot]"
          git config user.email "slavapost[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet && exit 0
          git commit -m "Import: ${TITLE}"
          git pull --rebase
          git push
